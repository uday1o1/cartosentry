name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: LibFuzzer (${{ github.event_name == 'schedule' && 'nightly' || 'local' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the frozen sanitizer fuzz suite
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            fuzz_suite="nightly"
          else
            fuzz_suite="local"
          fi
          docker build \
            --platform linux/amd64 \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --file docker/fuzz-linux-x86_64.Dockerfile \
            --tag cartosentry-fuzz:${GITHUB_SHA} \
            .
          python3 scripts/run_fuzz_container.py \
            --image cartosentry-fuzz:${GITHUB_SHA} \
            --suite "${fuzz_suite}" \
            --source-revision "${GITHUB_SHA}" \
            --output-root "benchmark-results/ci-fuzz-${fuzz_suite}"

      - name: Preserve fuzz qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-${{ github.event_name }}-${{ github.sha }}
          path: benchmark-results/ci-fuzz-*
          if-no-files-found: warn
          retention-days: 14

  foundation:
    name: Foundation (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            cc: gcc-12
            cxx: g++-12
          - name: macOS ARM64
            runner: macos-15
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UV_PYTHON_DOWNLOADS: manual

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned uv release
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: 0.11.23
          enable-cache: true

      - name: Install Python and the frozen environment
        run: |
          uv python install 3.12.13
          uv sync --frozen --python 3.12.13

      - name: Validate dependency and public-safety contracts
        run: |
          uv run python scripts/check_dependency_lock.py
          uv run python scripts/check_dependency_lock.py --self-test
          uv run python scripts/check_public_safety.py
          uv run python scripts/check_public_safety.py --self-test
          uv run python scripts/verify_public_data.py --manifest-only

      - name: Run Python static and dynamic checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: Build and test the native foundation
        run: |
          uv run cmake --preset developer
          uv run cmake --build --preset developer -j 4
          uv run ctest --preset developer
          uv run cmake --preset release
          uv run cmake --build --preset release -j 4
          uv run ctest --preset release

      - name: Run the locked native dependency probe
        run: |
          uv run cmake --preset compatibility
          uv run cmake --build --preset compatibility -j 4
          uv run ctest --preset compatibility

      - name: Run sanitizers on Linux
        if: runner.os == 'Linux'
        run: |
          uv run cmake --preset sanitizer
          uv run cmake --build --preset sanitizer -j 4
          uv run ctest --preset sanitizer
          uv run cmake --preset thread-sanitizer
          uv run cmake --build --preset thread-sanitizer -j 4
          uv run ctest --preset thread-sanitizer

      - name: Build and install release artifacts
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=0 uv build --wheel --sdist
          uv venv "${RUNNER_TEMP}/cartosentry-wheel" --python 3.12.13
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          uv pip install --python "${RUNNER_TEMP}/cartosentry-wheel/bin/python" "${wheel_path}"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cartosentry-wheel/bin/python" -c 'import cartosentry; assert cartosentry.native_self_check()'
