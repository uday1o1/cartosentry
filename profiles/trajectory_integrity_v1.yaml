{
  "schema_version": 1,
  "profile_id": "trajectory-integrity-v1",
  "profile_version": "1.0.1",
  "threshold_freeze_state": "FROZEN_BEFORE_M3_2_IMPLEMENTATION",
  "qualification_freeze_state": "FROZEN_AFTER_PREACCEPTANCE_AUDIT_BEFORE_M3_2_ACCEPTANCE",
  "hash_contract": "SHA-256 of canonical UTF-8 JSON with immutable_sha256 omitted",
  "immutable_sha256": "cc00a382071fe3cb88411ff2d0d3b23223198ecd7a24bd559abb9e70a838708e",
  "reference_trajectory_gate_sha256": "7f8a68faddc0afd2f59f59968b9af7e04cfbfbb012759564c6a61a37416e9370",
  "thresholds": {
    "timestamp.duplicate_count": {
      "operator": "max_le",
      "value": 0.0,
      "unit": "count",
      "responsible_metric": "number of consecutive source samples with identical canonical timestamps",
      "rationale": "Duplicate trajectory epochs make interpolation and ordering ambiguous."
    },
    "timestamp.regression_count": {
      "operator": "max_le",
      "value": 0.0,
      "unit": "count",
      "responsible_metric": "number of consecutive source samples whose canonical timestamp decreases",
      "rationale": "A postprocessed reference trajectory must remain strictly ordered."
    },
    "trajectory.coordinate_continuity_mismatch_count": {
      "operator": "max_le",
      "value": 0.0,
      "unit": "count",
      "responsible_metric": "time-domain, frame-name, and coordinate-support mismatches across source trajectory samples",
      "rationale": "A continuous trajectory must retain one explicit time domain and one named transform frame pair."
    },
    "timestamp.maximum_gap_ns": {
      "operator": "max_le",
      "value": 100000000.0,
      "unit": "ns",
      "responsible_metric": "elapsed time between consecutive source trajectory samples",
      "rationale": "Match the frozen continuous-trajectory support ceiling."
    },
    "trajectory.position_jump_residual_m": {
      "operator": "max_le",
      "value": 1.0,
      "unit": "m",
      "responsible_metric": "position increment residual after source-velocity prediction",
      "rationale": "Detect meter-scale discontinuities without rejecting the declared near-threshold case."
    },
    "trajectory.reference_position_residual_m": {
      "operator": "max_le",
      "value": 1.5,
      "unit": "m",
      "responsible_metric": "local position residual against declared independent or paired-coordinate support",
      "rationale": "Expose large bias-compatible disagreement only when reference support is declared."
    },
    "trajectory.velocity_residual_mps": {
      "operator": "max_le",
      "value": 0.75,
      "unit": "m/s",
      "responsible_metric": "robust position derivative minus source velocity",
      "rationale": "Detect sustained drift while allowing small postprocessed self-consistency residuals."
    },
    "trajectory.maximum_speed_mps": {
      "operator": "max_le",
      "value": 70.0,
      "unit": "m/s",
      "responsible_metric": "magnitude of robust local-world velocity",
      "rationale": "Reject implausible road-vehicle speeds without tuning to one route."
    },
    "trajectory.maximum_acceleration_mps2": {
      "operator": "max_le",
      "value": 15.0,
      "unit": "m/s^2",
      "responsible_metric": "magnitude of robust local-world acceleration",
      "rationale": "Flag severe kinematic discontinuities above ordinary road motion."
    },
    "trajectory.maximum_jerk_mps3": {
      "operator": "max_le",
      "value": 100.0,
      "unit": "m/s^3",
      "responsible_metric": "magnitude of robust local-world jerk",
      "rationale": "Localize severe position discontinuities while tolerating analytic stop boundaries."
    },
    "trajectory.maximum_yaw_rate_radps": {
      "operator": "abs_max_le",
      "value": 1.5,
      "unit": "rad/s",
      "responsible_metric": "absolute robust yaw rate",
      "rationale": "Retain the one-radian-per-second analytic turn with margin."
    },
    "trajectory.freeze_observed_speed_mps": {
      "operator": "max_le",
      "value": 0.1,
      "unit": "m/s",
      "responsible_metric": "observed position increment speed during source-supported motion",
      "rationale": "Identify position hold while remaining above numerical position noise."
    },
    "trajectory.freeze_source_speed_mps": {
      "operator": "min_ge",
      "value": 1.0,
      "unit": "m/s",
      "responsible_metric": "declared source-velocity magnitude during a candidate freeze",
      "rationale": "Prevent a truly stationary vehicle from being called a frozen trajectory."
    },
    "trajectory.freeze_minimum_duration_ns": {
      "operator": "min_ge",
      "value": 500000000.0,
      "unit": "ns",
      "responsible_metric": "consolidated duration of source-supported frozen position",
      "rationale": "Reject isolated quantization repeats while detecting sustained holds."
    }
  },
  "numerical_comparison": {
    "relative_tolerance": 1e-12,
    "absolute_tolerance": 1e-12
  },
  "event_consolidation": {
    "temporal_adjacency_ns": 500000000,
    "paired_step_maximum_duration_ns": 3000000000,
    "clear_windows_required": 2,
    "interval_convention": "half_open",
    "primary_rule_priority": [
      "timestamp_regression",
