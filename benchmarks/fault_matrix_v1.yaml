{
  "schema_version": 1,
  "fault_matrix_id": "cartosentry-v1-core",
  "matrix_version": "v1",
  "scope": "V1 trajectory and lidar contracts only",
  "severity_gate_outcomes": {
    "below_threshold": "EXPECT_NO_FINDING",
    "near_threshold": "EXPECT_NO_FINDING",
    "detectable": "EXPECT_FINDING_WHEN_OBSERVABLE"
  },
  "case_gate_outcome_overrides": {
    "trajectory.position_freeze/position-freeze-0p5s-near": "EXPECT_FINDING_WHEN_OBSERVABLE"
  },
  "fault_id_contract": {
    "algorithm": "sha256",
    "canonical_fields": [
      "fault_matrix_id",
      "operator_id",
      "case_id",
      "source_family_id",
      "source_identity_sha256"
    ],
    "prefix": "fault-sha256-"
  },
  "v1_operator_allowlist": [
    "trajectory.timestamp_discontinuity",
    "trajectory.position_jump",
    "trajectory.position_freeze",
    "trajectory.position_bias",
    "trajectory.position_drift",
    "lidar.point_time_shift",
    "lidar.ring_loss",
    "lidar.azimuth_sector_loss",
    "lidar.calibration_perturbation"
  ],
  "operators": [
    {
      "operator_id": "trajectory.timestamp_discontinuity",
      "contract_field": "trajectory sample timestamp",
      "ground_truth": "one discontinuity boundary followed by a persistent timestamp step with no exit regression",
      "cases": [
        {
          "case_id": "timestamp-gap-50ms-below",
          "severity": "below_threshold",
          "parameters": {"consecutive_delta_ns": 50000000}
        },
        {
          "case_id": "timestamp-gap-100ms-near",
          "severity": "near_threshold",
          "parameters": {"consecutive_delta_ns": 100000000}
        },
        {
          "case_id": "timestamp-gap-250ms-detectable",
          "severity": "detectable",
          "parameters": {"consecutive_delta_ns": 250000000}
        }
      ]
    },
    {
      "operator_id": "trajectory.position_jump",
      "contract_field": "T_enu_ref_applanix translation",
      "ground_truth": "injected translation interval",
      "cases": [
        {
          "case_id": "position-jump-0p05m-below",
          "severity": "below_threshold",
          "parameters": {"translation_m": [0.05, 0.0, 0.0], "duration_s": 0.5}
        },
        {
          "case_id": "position-jump-0p5m-near",
          "severity": "near_threshold",
          "parameters": {"translation_m": [0.5, 0.0, 0.0], "duration_s": 2.0}
        },
        {
          "case_id": "position-jump-2m-detectable",
          "severity": "detectable",
          "parameters": {"translation_m": [2.0, 0.0, 0.0], "duration_s": 2.0}
        }
      ]
    },
    {
      "operator_id": "trajectory.position_freeze",
      "contract_field": "T_enu_ref_applanix translation with source time retained",
      "ground_truth": "half-open interval whose position is held at its first sample",
      "cases": [
        {
          "case_id": "position-freeze-0p25s-below",
          "severity": "below_threshold",
          "parameters": {"duration_s": 0.25}
        },
        {
          "case_id": "position-freeze-0p5s-near",
          "severity": "near_threshold",
          "parameters": {"duration_s": 0.5}
        },
        {
          "case_id": "position-freeze-1s-detectable",
          "severity": "detectable",
          "parameters": {"duration_s": 1.0}
        }
      ]
    },
    {
      "operator_id": "trajectory.position_bias",
      "contract_field": "T_enu_ref_applanix translation",
      "ground_truth": "whole-support constant seed-scaled translation that is unobservable without independent reference support",
      "cases": [
        {
          "case_id": "position-bias-0p25m-below",
          "severity": "below_threshold",
          "parameters": {"translation_m": [0.25, 0.0, 0.0], "seed_scale_decrement_fraction": 0.01}
        },
        {
          "case_id": "position-bias-1p5m-near",
          "severity": "near_threshold",
          "parameters": {"translation_m": [1.5, 0.0, 0.0], "seed_scale_decrement_fraction": 0.01}
        },
        {
          "case_id": "position-bias-3m-detectable",
          "severity": "detectable",
          "parameters": {"translation_m": [3.0, 0.0, 0.0], "seed_scale_decrement_fraction": 0.01}
        }
      ]
    },
    {
      "operator_id": "trajectory.position_drift",
      "contract_field": "T_enu_ref_applanix translation",
      "ground_truth": "linearly increasing translation from the selected start through the remaining half-open trajectory support, reaching terminal_translation_m after duration_s",
      "cases": [
        {
          "case_id": "position-drift-0p1m-below",
          "severity": "below_threshold",
          "parameters": {"terminal_translation_m": [0.1, 0.0, 0.0], "duration_s": 1.0}
        },
        {
          "case_id": "position-drift-0p75m-near",
          "severity": "near_threshold",
          "parameters": {"terminal_translation_m": [0.75, 0.0, 0.0], "duration_s": 1.0}
        },
        {
          "case_id": "position-drift-2m-detectable",
          "severity": "detectable",
          "parameters": {"terminal_translation_m": [2.0, 0.0, 0.0], "duration_s": 1.0}
        }
      ]
    },
    {
      "operator_id": "lidar.point_time_shift",
      "contract_field": "float32 point time relative to scan midpoint",
      "ground_truth": "all shifted points and their source frame intervals",
      "cases": [
        {
          "case_id": "point-time-10ms-below",
          "severity": "below_threshold",
          "parameters": {"shift_ns": 10000000, "duration_frames": 5}
        },
        {
          "case_id": "point-time-30ms-near",
          "severity": "near_threshold",
          "parameters": {"shift_ns": 30000000, "duration_frames": 10}
        },
        {
          "case_id": "point-time-100ms-detectable",
          "severity": "detectable",
          "parameters": {"shift_ns": 100000000, "duration_frames": 20}
        },
        {
          "case_id": "point-time-300ms-detectable",
          "severity": "detectable",
          "parameters": {"shift_ns": 300000000, "duration_frames": 50}
        }
      ]
    },
    {
      "operator_id": "lidar.ring_loss",
      "contract_field": "declared lidar ring identifier",
      "ground_truth": "removed ring identifiers and affected source frames",
      "cases": [
        {
          "case_id": "ring-loss-1-short",
          "severity": "below_threshold",
          "parameters": {"ring_count": 1, "duration_frames": 5}
        },
        {
          "case_id": "ring-loss-4-medium",
          "severity": "near_threshold",
          "parameters": {"ring_count": 4, "duration_frames": 20}
        },
        {
          "case_id": "ring-loss-16-long",
          "severity": "detectable",
          "parameters": {"ring_count": 16, "duration_frames": 50}
        }
      ]
    },
    {
      "operator_id": "lidar.azimuth_sector_loss",
      "contract_field": "lidar point azimuth",
      "ground_truth": "removed azimuth interval and affected source frames",
      "cases": [
        {
          "case_id": "sector-loss-5deg-short",
          "severity": "below_threshold",
          "parameters": {"start_deg": 30.0, "width_deg": 5.0, "duration_frames": 5}
        },
        {
          "case_id": "sector-loss-30deg-medium",
          "severity": "near_threshold",
          "parameters": {"start_deg": 30.0, "width_deg": 30.0, "duration_frames": 20}
        },
        {
          "case_id": "sector-loss-90deg-long",
          "severity": "detectable",
          "parameters": {"start_deg": 30.0, "width_deg": 90.0, "duration_frames": 50}
        }
      ]
    },
    {
      "operator_id": "lidar.calibration_perturbation",
      "contract_field": "T_applanix_lidar",
      "ground_truth": "perturbed extrinsic and all derived point intervals",
      "cases": [
        {
          "case_id": "extrinsic-0p01m-0p1deg-below",
          "severity": "below_threshold",
          "parameters": {"translation_m": [0.01, 0.0, 0.0], "yaw_deg": 0.1}
        },
        {
          "case_id": "extrinsic-0p1m-1deg-near",
          "severity": "near_threshold",
          "parameters": {"translation_m": [0.1, 0.0, 0.0], "yaw_deg": 1.0}
        },
        {
          "case_id": "extrinsic-0p5m-5deg-detectable",
          "severity": "detectable",
          "parameters": {"translation_m": [0.5, 0.0, 0.0], "yaw_deg": 5.0}
        }
      ]
    }
  ],
  "explicitly_rejected_follow_on_operators": [
    "imu.time_shift",
    "imu.bias_step",
    "camera.frozen_frames",
    "camera.blur",
    "camera.exposure",
    "camera_lidar.extrinsic_perturbation",
    "radar.doppler_scale",
    "cross_modal.clock_shift",
    "topology.missing_road",
    "topology.wrong_direction"
  ],
  "operator_policy": "An operator is valid only when its exact identifier appears in v1_operator_allowlist and operators. Namespace similarity is not sufficient."
}
