capabilities:
  python:
    status: supported-with-gap
    observed: Python 3.12.13 imported the wheel on both required platforms.
    gap: The wheel declares Python >=3.8 without an upper bound.
  dependencies:
    status: supported-with-gap
    observed: The isolated default resolver completed on both required platforms.
    gap: Direct dependencies are broadly constrained and torch is mandatory for format-only use.
  platform:
    status: supported
    observed: The same generated V4 observations loaded on macOS ARM64 and Linux x86-64.
    gap: The pure Python wheel still depends on platform-specific transitive wheels.
  timestamps:
    status: adapter-required
    observed: Frame intervals and lidar and radar per-ray timestamps round-trip as uint64 microseconds.
    gap: Epoch, clock identifier, time reference, signed nanoseconds, and raw-field provenance are not typed.
  calibration:
    status: adapter-required
    observed: Named-frame static extrinsics and typed camera and lidar intrinsics round-trip.
    gap: Calibration identity, validity interval, uncertainty, and a typed radar model are not provided.
  pose:
    status: adapter-required
    observed: Named dynamic 4x4 poses and uint64 microsecond samples interpolate through the pose graph.
    gap: Pose uncertainty, quality, source lineage, and CartoSentry global-coordinate semantics need adapter data.
  camera:
    status: supported-with-gap
    observed: Encoded PNG data, start and end timestamps, extrinsics, and ideal pinhole intrinsics round-trip.
    gap: Source-object lineage and explicit clock semantics need adapter data.
  lidar:
    status: supported-with-gap
    observed: Per-ray time, direction, model element, distance, intensity, frame interval, extrinsics, and structured intrinsics round-trip.
    gap: Source-object lineage and explicit clock semantics need adapter data.
  radar:
    status: adapter-required
    observed: Per-detection time, direction, distance, frame interval, and extrinsics round-trip.
    gap: Velocity, RCS, status, and radar model fields are generic arrays rather than stable typed contracts.
  writer_api:
    status: adapter-required
    observed: The public V4 writer and reader APIs created and loaded the generated sample.
    gap: Constructing the required sequence interval uses ncore.impl.common.transformations.HalfClosedInterval.
